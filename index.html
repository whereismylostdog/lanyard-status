<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #336699;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #status-row {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  #dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #aaa;
    display: inline-block;
    flex-shrink: 0;
  }
  #spotify {
    color: #336699;
    display: none;
    line-height: 1.4;
  }
  #spotify span {
    color: #6799c5;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="status-row">
    <span id="dot"></span>
    <span id="text">...</span>
  </div>
  <div id="spotify"></div>
</div>
<script>
  fetch("https://api.lanyard.rest/v1/users/542890352303013898")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var data = d.data;
      var dot = document.getElementById("dot");
      var text = document.getElementById("text");
      var spotify = document.getElementById("spotify");

      if (data.discord_status === "online" || data.discord_status === "idle" || data.discord_status === "dnd") {
        dot.style.background = "#6a994e";
        text.textContent = "online now";
      } else {
        dot.style.background = "#aaa";
        text.textContent = "offline";
      }

      if (data.listening_to_spotify && data.spotify) {
        var song = data.spotify.song;
        var artist = data.spotify.artist;
        spotify.style.display = "block";
        spotify.innerHTML = "listening to: <span>" + song + "</span> by " + artist;
      }
    })
    .catch(function() {
      document.getElementById("text").textContent = "offline";
    });
</script>
</body>
</html>
